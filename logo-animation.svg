<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <circle cx="50" cy="50" r="45" fill="none" stroke="#2e7d32" stroke-width="3">
        <animate attributeName="stroke" values="#2e7d32;#6a1b9a;#1a237e;#2e7d32" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="50" cy="50" r="25" fill="#2e7d32">
        <animate attributeName="fill" values="#2e7d32;#6a1b9a;#1a237e;#2e7d32" dur="3s" repeatCount="indefinite" />
    </circle>
    <text x="50" y="60" text-anchor="middle" fill="white" font-size="12" font-weight="bold">TOYOTA</text>
</svg>